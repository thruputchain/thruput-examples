[package]
name = "swap"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[dependencies]
sdk = { workspace = true, features = ["storage"] }
groundhog-erc20-if = { workspace = true }
uint = { version = "0.10.0", default-features = false }
heapless = { workspace = true }

# Optional
erc20 = { path = "../erc20", features = ["dev"], optional = true }

[features]
entrypoints = ["implementation"]
implementation = []
dev = ["sdk/dev", "dep:erc20", "implementation"]

[dev-dependencies]
swap = { path = ".", features = ["dev"] }
