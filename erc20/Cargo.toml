[package]
name = "erc20"
description = "Example ERC20 contract for the Groundhog blockchain"
version = "0.1.0"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = [
    "sdk/dev",
    "metadata",
    "groundhog-erc20-if/dev",
    "groundhog-erc20-metadata-if/dev",
    ]
metadata = ["dep:groundhog-erc20-metadata-if"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true, features = ["storage"] }
groundhog-erc20-if = { workspace = true, features = ["storage"] }
groundhog-erc20-metadata-if = { workspace = true, optional = true }

[dev-dependencies]
erc20 = { path = ".", features = ["dev"] }
sha2.workspace = true

# RPC integration test (tests/integration.rs), run via `groundhog test --integration`.
groundhog-json-rpc-client = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
groundhog-signing = { workspace = true }
groundhog-contract-util = { workspace = true }
groundhog-xdr = { workspace = true }
xdrs = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

[[test]]
name = "integration"
# test usage: GROUNDHOG_HOG_DEVNODE_BINARY=/path/to/hog-devnode groundhog test --integration
test = false
