[package]
name = "multi-throws"
description = "Example contract demonstrating multiple error types with throws(A, B) syntax"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "sdk/debugging"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }


[dev-dependencies]
multi-throws = { path = ".", features = ["dev"] }
