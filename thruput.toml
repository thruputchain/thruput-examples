# Project-local Thruput config.
#
# User-level defaults live in ~/.config/thruput/config.toml. Profiles here
# merge with global profiles of the same name, and project aliases override
# global aliases.
#
# Keep an explicit local default for build scripts using older supported CLI
# releases, including CI and fresh clones without global configuration.
# Newer CLIs can build with the local overlay even without a selected default.

default_profile = "local"

[profile.local]
network = "local"

[profile.futurenet]
network = "futurenet"
