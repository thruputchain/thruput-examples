[package]
name = "fixed-odds"
version = "0.1.0"
description = "Example fixed-odds betting book whose solvency the runtime checks across a block's concurrent bets"
edition = "2024"
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "fixed_odds"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[features]
entrypoints = []
default = ["dev"]
dev = ["thruput-sdk/dev"]

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
thruput-erc20-if = { workspace = true }

[dev-dependencies]
fixed-odds = { path = ".", features = ["dev"] }
erc20 = { path = "../erc20", features = ["dev"] }
