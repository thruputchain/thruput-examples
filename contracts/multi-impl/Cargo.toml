[package]
name = "multi-impl"
description = "Example contract implementing two traits from a separate crate"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "multi-impl-if/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "multi_impl"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }

multi-impl-if = { path = "../../interfaces/multi-impl-if" }

[dev-dependencies]
multi-impl = { path = ".", features = ["dev"] }
