[package]
name = "permit-wallet"
description = "An owner's wallet that turns off-chain signatures into ERC20 permits"
version = "0.1.0"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = [
    "sdk/dev",
    "dep:thiserror",
    "thruput-signed-op/dev",
    "thruput-erc20-permit-if/dev",
]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "permit_wallet"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
# `alloc`: minting encodes the auth-token node into a `Vec`.
sdk = { workspace = true, features = ["alloc"] }
thruput-signed-op = { workspace = true }
thruput-erc20-permit-if = { workspace = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
permit-wallet = { path = ".", features = ["dev"] }
# The other two contracts of the permit flow, as native mocks.
erc20 = { path = "../erc20", features = ["dev"] }
permit-relayer = { path = "../permit-relayer", features = ["dev"] }
thruput-signed-op-if = { workspace = true, features = ["dev"] }
# The off-chain signer's half: the preimage a signature covers, and a key to
# sign it with.
thruput-domain-separator = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true }
# The live flow on a devnode (`tests/testkit_permit.rs`, `#[ignore]`d).
thruput-testkit = { workspace = true }
thruput-json-rpc-client = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }

[lints]
clippy.result_large_err = "allow"
