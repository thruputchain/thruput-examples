[package]
name = "standard-token-factory"
description = "Factory for deterministic Groundhog standard token deployments"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
entrypoints = []
dev = [
    "sdk/dev",
    "thruput-erc20-if/dev",
    "standard-token-factory-if/dev",
]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "standard_token_factory"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
thruput-erc20-if = { workspace = true }
standard-token-factory-if = { path = "../../interfaces/standard-token-factory-if", version = "=0.1.0" }

[dev-dependencies]
standard-token-factory = { path = ".", features = ["dev"] }
standard-token = { path = "../standard-token", features = ["dev"] }
token-factory-failing-child = { path = "../../helpers/token-factory-failing-child", features = ["dev"] }
thruput-testkit = { workspace = true }
thruput-signing = { workspace = true }
thruput-json-rpc-types = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
