[package]
name = "voting"
version = "0.1.0"
description = "Multiple-question polls with wallet-based voting and mergeable totals"
edition = "2024"
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "voting"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[features]
entrypoints = []
default = ["dev"]
dev = ["thruput-sdk/dev"]

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
heapless.workspace = true

[dev-dependencies]
voting = { path = ".", features = ["dev"] }
