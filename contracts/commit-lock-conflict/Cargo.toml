[package]
name = "commit-lock-conflict"
version = "0.1.0"
description = "Minimal reproduction: a transaction that is dropped for a conflict still makes another's commit-locked calls fail"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "commit_lock_conflict"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
commit-lock-conflict = { path = ".", features = ["dev"] }
