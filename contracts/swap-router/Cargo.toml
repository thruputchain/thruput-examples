[package]
name = "swap-router"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "swap_router"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
thiserror = { workspace = true }
swap-if = { path = "../../interfaces/swap-if" }
swap-pair = { path = "../../engines/swap-pair" }
swap-driver = { path = "../swap-driver" }
swap-handler = { path = "../swap-handler" }

# Optional, for native tests
erc20 = { path = "../erc20", features = ["dev"], optional = true }
groundhog-erc20-metadata-if = { workspace = true, features = ["dev"], optional = true }

[features]
calibration = ["batch-driver/calibration"]
entrypoints = ["sdk/alloc"]
erc20_metadata = ["erc20?/metadata", "dep:groundhog-erc20-metadata-if"]
dev = ["sdk/dev", "dep:erc20", "erc20_metadata", "swap-if/dev", "swap-pair/dev", "swap-driver/dev", "swap-handler/dev"]
guest_test = [] # Test contracts compiled to guest binaries (instead of compiling natively)

[dev-dependencies]
swap-router = { path = ".", features = ["dev"] }
swap-factory = { path = "../swap-factory", features = ["dev"] }
groundhog-testkit = { workspace = true }
groundhog-xdr = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uint = { version = "0.10.0", default-features = false }
batch-driver = { path = "../../helpers/batch-driver" }
groundhog-event = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
xdrs = { workspace = true }

[lints]
clippy.result_large_err = "allow"
