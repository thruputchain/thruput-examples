[package]
name = "swap-router"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "swap_router"
path = "src/main.rs"
required-features = ["rv32-entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
thiserror = { workspace = true }
swap-pair = { path = "../swap-pair" }
swap-driver = { path = "../swap-driver" }
swap-request = { path = "../swap-request" }

# Optional, for native tests
erc20 = { path = "../erc20", features = ["dev"], optional = true }
groundhog-erc20-metadata-if = { workspace = true, features = ["dev"], optional = true }

[features]
entrypoints = ["sdk/alloc"]
rv32-entrypoints = ["entrypoints"]
erc20_metadata = ["erc20?/metadata", "dep:groundhog-erc20-metadata-if"]
dev = ["sdk/dev", "dep:erc20", "erc20_metadata", "swap-pair/dev", "swap-driver/dev", "swap-request/dev"]
wasm_test = []

[dev-dependencies]
swap-router = { path = ".", features = ["dev"] }
groundhog-testkit = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
clippy.result_large_err = "allow"
