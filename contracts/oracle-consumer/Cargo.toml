[package]
name = "oracle-consumer"
description = "Read an oracle price and value a token quantity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "oracle_consumer"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
oracle-consumer = { path = ".", features = ["dev"] }
