[package]
name = "cross-call"
description = "Example cross-contract call patterns"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
entrypoints = []
rv32-entrypoints = ["entrypoints"]
dev = ["sdk/dev", "sdk/debugging", "fibonacci/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "cross_call"
path = "src/main.rs"
required-features = ["rv32-entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
fibonacci = { path = "../fibonacci" }


[dev-dependencies]
cross-call = { path = ".", features = ["dev"] }
