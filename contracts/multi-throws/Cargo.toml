[package]
name = "multi-throws"
description = "Example contract demonstrating multiple error types with throws(A, B) syntax"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "multi_throws"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }


[dev-dependencies]
multi-throws = { path = ".", features = ["dev"] }
