[package]
name = "swap-handler"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license = "GPL-3.0-or-later" # port of UniswapV2; see /LICENSE-GPL-3.0
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "swap_handler"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
thruput-sdk = { workspace = true }
thruput-erc20-if = { workspace = true }
swap-if = { path = "../../interfaces/swap-if" }
swap-pair = { path = "../../engines/swap-pair" }

[features]
# `entrypoints` builds the deployable handler contract (its exported methods).
entrypoints = ["implementation", "thruput-sdk/alloc"]
implementation = []
dev = ["thruput-sdk/dev", "swap-if/dev", "swap-pair/dev", "implementation"]

[dev-dependencies]
swap-handler = { path = ".", features = ["dev"] }

[lints]
clippy.result_large_err = "allow"
