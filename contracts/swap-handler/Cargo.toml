[package]
name = "swap-handler"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "swap_handler"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
swap-if = { path = "../swap-if" }

[features]
# `entrypoints` builds the deployable handler contract (its exported methods).
entrypoints = ["implementation", "sdk/alloc"]
implementation = []
dev = ["sdk/dev", "swap-if/dev", "implementation"]

[dev-dependencies]
swap-handler = { path = ".", features = ["dev"] }

[lints]
clippy.result_large_err = "allow"
