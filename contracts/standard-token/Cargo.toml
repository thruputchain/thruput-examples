[package]
name = "standard-token"
description = "Metadata-enabled standard token deployed by the Thruput token factory"
version = "0.1.0"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = [
    "thruput-sdk/dev",
    "thruput-erc20-if/dev",
    "thruput-erc20-controls-if/dev",
    "standard-token-factory-if/dev",
]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "standard_token"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
thruput-sdk = { workspace = true }
thruput-erc20-if = { workspace = true }
thruput-erc20-controls-if = { workspace = true }
thruput-erc20-metadata-if = { workspace = true }
standard-token-factory-if = { path = "../../interfaces/standard-token-factory-if", version = "=0.1.0" }

[dev-dependencies]
standard-token = { path = ".", features = ["dev"] }
thruput-xdr = { workspace = true }
