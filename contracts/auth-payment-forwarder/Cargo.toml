[package]
name = "auth-payment-forwarder"
description = "Forwarding a payment capability without knowing the payer or payload"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "auth-payment-service/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "auth_payment_forwarder"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
auth-payment-service = { path = "../auth-payment-service" }

[lints]
clippy.result_large_err = "allow"
