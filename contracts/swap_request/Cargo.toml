[package]
name = "swap_request"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "swap_request"
path = "src/main.rs"
required-features = ["rv32-entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
uint = { version = "0.10.0", default-features = false }
heapless = { workspace = true }
thiserror = { workspace = true }
batch_driver = { path = "../../helpers/batch_driver" }
swap = { path = "../swap" }

# Optional, for native tests
erc20 = { path = "../erc20", features = ["dev"], optional = true }
groundhog-erc20-metadata-if = { workspace = true, features = ["dev"], optional = true }

[features]
# `entrypoints` builds the deployable handler contract (its exported methods).
entrypoints = ["implementation", "sdk/alloc"]
rv32-entrypoints = ["entrypoints"]
implementation = []
erc20_metadata = ["erc20?/metadata", "dep:groundhog-erc20-metadata-if"]
dev = ["sdk/dev", "dep:erc20", "erc20_metadata", "swap/dev", "implementation"]
wasm_test = []

[dev-dependencies]
swap_request = { path = ".", features = ["dev"] }

[lints]
workspace = true
