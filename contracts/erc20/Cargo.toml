[package]
name = "erc20"
description = "Example ERC20 contract for the Groundhog blockchain"
version = "0.1.0"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = ["metadata", "permit"]
dev = [
    "sdk/dev",
    "groundhog-erc20-if/dev",
    "metadata",
    "groundhog-erc20-metadata-if/dev",
    "permit",
    "groundhog-erc20-permit-if/dev",
    ]
metadata = ["dep:groundhog-erc20-metadata-if"]
# Off-chain approvals: `ERC20Permit`, consuming the `PermitGrant` auth tokens a
# `SignedOp` wallet mints (see `permit-wallet`).
permit = ["dep:groundhog-erc20-permit-if"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "erc20"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
groundhog-erc20-metadata-if = { workspace = true, optional = true }
groundhog-erc20-permit-if = { workspace = true, optional = true }

[dev-dependencies]
erc20 = { path = ".", features = ["dev"] }
sha2.workspace = true

# RPC integration test (tests/integration.rs), run via `groundhog test --integration`.
integration-test = { path = "../../helpers/integration-test" }
groundhog-xdr = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "integration"
test = false
# test usage: GROUNDHOG_DEVNODE_BINARY=/path/to/hog-devnode groundhog test --integration
