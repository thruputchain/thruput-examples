[package]
name = "fibonacci"
description = "Example stateless Fibonacci contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
entrypoints = []
rv32-entrypoints = ["entrypoints"]
dev = ["sdk/dev", "sdk/debugging"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[[bin]]
name = "fibonacci"
path = "src/main.rs"
required-features = ["rv32-entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }


[dev-dependencies]
fibonacci = { path = ".", features = ["dev"] }
