[package]
name = "fibonacci"
description = "Example stateless Fibonacci contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "fibonacci"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
thruput-sdk = { workspace = true }


[dev-dependencies]
fibonacci = { path = ".", features = ["dev"] }
