[package]
name = "counter"
version = "0.1.0"
description = "Example counter contract: NNInt storage, an event, and a contract error; the same contract `thruput new` generates"
edition = "2024"
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "counter"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[features]
entrypoints = []
default = ["dev"]
dev = ["thruput-sdk/dev"]

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
counter = { path = ".", features = ["dev"] }

# RPC integration test
integration-test = { path = "../../helpers/integration-test" }
tokio = { workspace = true }

[[test]]
name = "integration"
test = false  # use `thruput test --integration`
