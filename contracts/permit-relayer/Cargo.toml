[package]
name = "permit-relayer"
description = "Carries an owner's signed ERC20 permit to their token in one frame"
version = "0.1.0"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "groundhog-signed-op-if/dev", "groundhog-erc20-permit-if/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "permit_relayer"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
groundhog-signed-op-if = { workspace = true }
groundhog-erc20-permit-if = { workspace = true }

[dev-dependencies]
permit-relayer = { path = ".", features = ["dev"] }

[lints]
clippy.result_large_err = "allow"
