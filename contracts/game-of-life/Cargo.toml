[package]
name = "game-of-life"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[[bin]]
name = "game_of_life"
path = "src/main.rs"
required-features = ["rv32-entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
sha2 = { workspace = true }
batch-driver = { path = "../../helpers/batch-driver" }
game-of-life-core = { path = "../../helpers/game-of-life-core" }

[features]
entrypoints = []
rv32-entrypoints = ["entrypoints"]
default = ["dev"]
dev = ["sdk/dev", "batch-driver/dev"]

[lints]
clippy.result_large_err = "allow"
