[package]
name = "sep41-token"
description = "Example SEP-41 token contract for the Groundhog blockchain"
version = "0.1.0"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "sep41-token-if/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "sep41_token"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
sep41-token-if = { path = "../../interfaces/sep41-token-if", version = "=0.1.0" }

[dev-dependencies]
sep41-token = { path = ".", features = ["dev"] }
