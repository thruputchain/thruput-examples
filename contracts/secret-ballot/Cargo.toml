[package]
name = "secret-ballot"
version = "0.1.0"
description = "Example secret-ballot poll: encrypted votes, counted in the open, decrypted by trustees"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "secret_ballot"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[features]
entrypoints = []
default = ["dev"]
dev = ["thruput-sdk/dev"]

[dependencies]
thruput-sdk = { workspace = true, features = ["alloc"] }
thruput-erc20-if = { workspace = true }
heapless.workspace = true

[dev-dependencies]
secret-ballot = { path = ".", features = ["dev"] }
curve25519-dalek.workspace = true
erc20 = { path = "../erc20", features = ["dev"] }
sha2.workspace = true
