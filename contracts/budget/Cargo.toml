[package]
name = "budget"
version = "0.1.0"
description = "Example shared budget that many spenders draw on at once, under rate limits the runtime enforces across each block"
edition = "2024"
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "budget"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[features]
entrypoints = []
default = ["dev"]
dev = ["thruput-sdk/dev"]

[dependencies]
thruput-sdk = { workspace = true }
thruput-erc20-if = { workspace = true }

[dev-dependencies]
budget = { path = ".", features = ["dev"] }
erc20 = { path = "../erc20", features = ["dev"] }
