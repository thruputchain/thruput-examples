[package]
name = "auth-payment-service"
description = "A configured payer hidden behind an opaque authorization interface"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "groundhog-erc20-permit-if/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "auth_payment_service"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-permit-if = { workspace = true }

[lints]
clippy.result_large_err = "allow"
