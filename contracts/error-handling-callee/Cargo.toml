[package]
name = "error-handling-callee"
description = "Example contract producing various error conditions for cross-contract call testing"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "sdk/debugging"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "error_handling_callee"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }


[dev-dependencies]
error-handling-callee = { path = ".", features = ["dev"] }
