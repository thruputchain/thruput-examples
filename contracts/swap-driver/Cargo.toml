[package]
name = "swap-driver"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "swap_driver"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
uint = { version = "0.10.0", default-features = false }
heapless = { workspace = true }
thiserror = { workspace = true }
batch-driver = { path = "../../helpers/batch-driver" }
swap-if = { path = "../../interfaces/swap-if" }
swap-pair = { path = "../../engines/swap-pair" }
swap-handler = { path = "../swap-handler" }

# Optional, for native tests
erc20 = { path = "../erc20", features = ["dev"], optional = true }
groundhog-erc20-metadata-if = { workspace = true, features = ["dev"], optional = true }

[features]
entrypoints = ["sdk/alloc"]
erc20_metadata = ["erc20?/metadata", "dep:groundhog-erc20-metadata-if"]
dev = ["sdk/dev", "dep:erc20", "erc20_metadata", "swap-if/dev", "swap-pair/dev", "swap-handler/dev", "batch-driver/dev"]
guest_test = []

[dev-dependencies]
swap-driver = { path = ".", features = ["dev"] }
# Reading per-syscall gas out of a frame trace, for the guest-only
# EPILOGUE_GAS calibration.
groundhog-trace = { workspace = true }

[lints]
clippy.result_large_err = "allow"
