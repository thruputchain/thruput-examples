[package]
name = "events"
description = "Example contract demonstrating #[derive(Event)] with various topic and payload patterns"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "sdk/debugging"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "events"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }


[dev-dependencies]
events = { path = ".", features = ["dev"] }
sha2 = { workspace = true }
