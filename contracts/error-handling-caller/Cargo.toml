[package]
name = "error-handling-caller"
description = "Example contract demonstrating comprehensive cross-contract error handling"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev", "error-handling-callee/dev", "fibonacci/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "error_handling_caller"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
thruput-sdk = { workspace = true }
error-handling-callee = { path = "../error-handling-callee" }
fibonacci = { path = "../fibonacci" }


[dev-dependencies]
error-handling-caller = { path = ".", features = ["dev"] }
