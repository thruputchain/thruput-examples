[package]
name = "speedex"
description = "A SPEEDEX-style batch exchange over several assets, with commutative offer submission"
version = "0.1.0"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "speedex"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[features]
# The clearing engine keeps the batch's histogram in a `Vec`, so the guest needs the SDK's allocator.
entrypoints = ["sdk/alloc"]
dev = ["sdk/dev", "unique-ids/dev"]

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
unique-ids = { path = "../../helpers/unique-ids" }

[dev-dependencies]
speedex = { path = ".", features = ["dev"] }
erc20 = { path = "../erc20", features = ["dev"] }

[lints]
clippy.result_large_err = "allow"
