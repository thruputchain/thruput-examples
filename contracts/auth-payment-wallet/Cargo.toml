[package]
name = "auth-payment-wallet"
description = "Signing a payment as a nested service grant and ERC20 debit grant"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = [
    "sdk/dev",
    "auth-payment-service/dev",
    "groundhog-signed-op/dev",
    "groundhog-erc20-permit-if/dev",
]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "auth_payment_wallet"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true, features = ["alloc"] }
auth-payment-service = { path = "../auth-payment-service" }
groundhog-signed-op = { workspace = true }
groundhog-erc20-permit-if = { workspace = true }

[dev-dependencies]
auth-payment-wallet = { path = ".", features = ["dev"] }
auth-payment-forwarder = { path = "../auth-payment-forwarder", features = ["dev"] }
erc20 = { path = "../erc20", features = ["dev"] }
groundhog-domain-separator = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true }

[lints]
clippy.result_large_err = "allow"
