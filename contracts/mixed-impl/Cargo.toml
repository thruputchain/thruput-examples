[package]
name = "mixed-impl"
description = "Example contract mixing an inherent #[contract] impl with a trait #[contract] impl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "mixed_impl"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
mixed-impl = { path = ".", features = ["dev"] }
