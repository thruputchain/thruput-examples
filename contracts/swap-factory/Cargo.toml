[package]
name = "swap-factory"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "swap_factory"
path = "src/main.rs"
required-features = ["rv32-entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
swap-if = { path = "../swap-if" }

[features]
entrypoints = ["sdk/alloc"]
rv32-entrypoints = ["entrypoints"]
dev = ["sdk/dev", "swap-if/dev"]

[dev-dependencies]
swap-factory = { path = ".", features = ["dev"] }
swap-pair = { path = "../swap-pair", features = ["dev"] }
swap-handler = { path = "../swap-handler", features = ["dev"] }
swap-driver = { path = "../swap-driver", features = ["dev"] }
swap-router = { path = "../swap-router", features = ["dev"] }
erc20 = { path = "../erc20", features = ["dev"] }
groundhog-erc20-if = { workspace = true }

[lints]
clippy.result_large_err = "allow"
