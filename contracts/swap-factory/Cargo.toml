[package]
name = "swap-factory"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "swap_factory"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
thruput-sdk = { workspace = true }
thruput-erc20-if = { workspace = true }
swap-if = { path = "../../interfaces/swap-if" }

[features]
entrypoints = ["thruput-sdk/alloc"]
dev = ["thruput-sdk/dev", "swap-if/dev"]
guest_test = []

[dev-dependencies]
swap-factory = { path = ".", features = ["dev"] }
swap-pair = { path = "../../engines/swap-pair", features = ["dev"] }
swap-handler = { path = "../swap-handler", features = ["dev"] }
swap-driver = { path = "../swap-driver", features = ["dev"] }
swap-router = { path = "../swap-router", features = ["dev"] }
erc20 = { path = "../erc20", features = ["dev"] }
thruput-erc20-if = { workspace = true }
# Registering the native token at its precompiled address, which the
# factory spends the pool's funding from.
thruput-xdr = { workspace = true }

[lints]
clippy.result_large_err = "allow"
