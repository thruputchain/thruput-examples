[package]
name = "swap-factory"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "swap_factory"
path = "src/main.rs"
required-features = ["rv32-entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
swap-if = { path = "../swap-if" }
swap-pair = { path = "../swap-pair" }
swap-request = { path = "../swap-request" }
swap-driver = { path = "../swap-driver" }
swap-router = { path = "../swap-router" }

# Optional, for native tests
erc20 = { path = "../erc20", features = ["dev"], optional = true }

[features]
entrypoints = ["sdk/alloc"]
rv32-entrypoints = ["entrypoints"]
dev = [
    "sdk/dev",
    "swap-if/dev",
    "dep:erc20",
    "swap-pair/dev",
    "swap-request/dev",
    "swap-driver/dev",
    "swap-router/dev",
]

[dev-dependencies]
swap-factory = { path = ".", features = ["dev"] }

[lints]
clippy.result_large_err = "allow"
