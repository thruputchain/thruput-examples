[package]
name = "swap-pair"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[[bin]]
name = "swap_pair"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
groundhog-erc20-if = { workspace = true }
swap-if = { path = "../swap-if" }
heapless = { workspace = true }

# Optional
erc20 = { path = "../erc20", features = ["dev"], optional = true }

[features]
entrypoints = ["implementation", "sdk/alloc"]
implementation = []
dev = ["sdk/dev", "dep:erc20", "implementation", "swap-if/dev"]

[dev-dependencies]
swap-pair = { path = ".", features = ["dev"] }

[lints]
clippy.result_large_err = "allow"
