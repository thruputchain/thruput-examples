[workspace]
members = [
    "fibonacci",
    "cross-call",
    "error-handling-callee",
    "error-handling-caller",
    "multi-impl-traits",
    "multi-impl",
    "multi-throws",
    "events",
    "sim-fixtures/caller-counter",
    "sim-fixtures/calldata",
    "sim-fixtures/nnint-stress",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
sdk = { registry = "groundhog", version = "0.15.0" }
