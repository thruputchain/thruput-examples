cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"

members = [
    "contracts/*",
    "sim-fixtures/*",
    "helpers/*",
    ]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Groundhog Team"]
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/groundhog-examples.git"
homepage = "https://github.com/groundhogchain/groundhog-examples.git"
keywords = ["groundhog"]
categories = ["blockchain"]

[workspace.dependencies]
# from sdk_rs repo:
sdk = { registry = "groundhog", version = "0.19.1" }
groundhog-contract-util = { registry = "groundhog", version = "0.19.1" }
groundhog-u256 = { registry = "groundhog", version = "0.19.2", default-features = false }
groundhog-erc20-if = { registry = "groundhog", version = "0.1.9" }
groundhog-erc20-metadata-if = { registry = "groundhog", version = "0.1.9" }

# from groundhog-rpc repo:
groundhog-json-rpc-client = { registry = "groundhog", version = "=0.9.0" }
groundhog-json-rpc-types = { registry = "groundhog", version = "=0.9.0" }
groundhog-signing = { registry = "groundhog", version = "=0.9.0" }
groundhog-testkit = { registry = "groundhog", version = "=0.9.0" }

# from other groundhog crates:
groundhog-xdr = { registry = "groundhog", version = "=0.20.6", features = ["serde", "xdrs"] }
xdrs = { registry = "groundhog", version = "0.8.4", features = ["alloc"] }

# from crates.io:
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
hex-literal = "1.0.0"
heapless = { version = "0.9.2" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
hex = "0.4"

[profile.release]
trim-paths = "all" # unstable

