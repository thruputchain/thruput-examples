[workspace]
members = ["fibonacci", "cross-call", "error-handling-callee", "error-handling-caller", "multi-impl-traits", "multi-impl", "multi-throws", "events"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
sdk = { registry = "groundhog", version = "0.8.2" }
xdrs = { registry = "groundhog", version = "0.5.2", features = ["derive", "int128", "heapless"] }
