cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"

members = [
    "fibonacci",
    "cross-call",
    "error-handling-callee",
    "error-handling-caller",
    "multi-impl-traits",
    "multi-impl",
    "multi-throws",
    "events",
    "sim-fixtures/caller-counter",
    "sim-fixtures/calldata",
    "sim-fixtures/nnint-stress",
    "erc20",
    "swap",
    "swap_driver",
    "swap_router",
    ]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Groundhog Team"]
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/groundhog-examples.git"
homepage = "https://github.com/groundhogchain/groundhog-examples.git"
keywords = ["groundhog"]
categories = ["blockchain"]

[workspace.dependencies]
sdk = { registry = "groundhog", version = "0.15.0" }
groundhog-erc20-if = { registry = "groundhog", version = "=0.1.3" }
groundhog-erc20-metadata-if = { registry = "groundhog", version = "=0.1.3" }

# Off-chain developer tooling, for RPC integration tests.
groundhog-json-rpc-client = { registry = "groundhog", version = "=0.5.4" }
groundhog-json-rpc-types = { registry = "groundhog", version = "=0.5.4" }
groundhog-signing = { registry = "groundhog", version = "=0.5.4" }
groundhog-contract-util = { registry = "groundhog", version = "0.14.7" }
groundhog-xdr = { registry = "groundhog", version = "=0.13.7", features = ["serde", "xdrs"] }
xdrs = { registry = "groundhog", version = "0.7.1", features = ["alloc"] }

# crates.io dependencies
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
hex-literal = "1.0.0"
heapless = { version = "0.9.2" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
hex = "0.4"

[workspace.lints.clippy]
result_large_err = "allow"

[profile.release]
trim-paths = "all" # unstable
