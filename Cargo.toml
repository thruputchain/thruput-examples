[workspace]
members = ["fibonacci", "cross-call"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
sdk = { registry = "groundhog", version = "0.5.2" }
xdrs = { registry = "groundhog", version = "0.5.2", features = ["derive", "int128", "heapless"] }
thiserror = { version = "2.0.12", default-features = false }
