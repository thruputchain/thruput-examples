cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"

# A folder in `contracts/` is one example crate or a project folder of related
# crates. A `contracts/*` glob fails on project folders, which have no
# `Cargo.toml`, so list the examples by name and glob each project folder.
members = [
    "contracts/airdrop",
    "contracts/counter",
    "contracts/counter-live",
    "contracts/cross-call",
    "contracts/cross-trait-throws",
    "contracts/erc20",
    "contracts/error-handling-callee",
    "contracts/error-handling-caller",
    "contracts/events",
    "contracts/fibonacci",
    "contracts/mixed-impl",
    "contracts/multi-impl",
    "contracts/multi-impl-if",
    "contracts/multi-throws",
    "contracts/oracle-consumer",
    "contracts/speedex",
    "contracts/voting",
    "contracts/erc20/integration-test",
    "contracts/fhe/*",
    "contracts/permit/*",
    "contracts/stellar-account/*",
    "contracts/swap/*",
    "contracts/token-factory/*",
    "contracts/waitlist/*",
    "contracts/swap/bench/clvr-bench",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Thruput Team"]
publish = false
repository = "https://github.com/thruputchain/thruput-examples.git"
homepage = "https://github.com/thruputchain/thruput-examples"
keywords = ["thruput"]
categories = ["blockchain"]

[workspace.dependencies]
# from thruput-sdk-rs:
thruput-sdk = { version = "=0.64.0" }
thruput-contract-util = { version = "=0.64.0" }
thruput-u256 = { version = "=0.64.0", default-features = false }
thruput-domain-separator = { version = "=0.64.0", default-features = false }
thruput-event = { version = "=0.64.0" }
thruput-erc20-if = { version = "=0.1.79" }
thruput-erc20-metadata-if = { version = "=0.1.79" }
thruput-erc20-controls-if = { version = "=0.1.79" }
thruput-erc20-permit-if = { version = "=0.1.79" }
thruput-signed-op-if = { version = "=0.1.79" }
thruput-signed-op = { version = "=0.1.79" }

# from thruput-tools:
thruput-json-rpc-client = { version = "=0.48.0" }
thruput-json-rpc-types = { version = "=0.48.0" }
thruput-cli = { package = "thruput", version = "=0.48.0" }
thruput-signing = { version = "=0.48.0" }
thruput-testkit = { version = "=0.48.0" }

# from thruput-protocol-rs (now on crates.io)
thruput-xdr = { version = "=0.69.0", features = ["serde", "xdrs"] }
thruput-trace = { version = "=0.69.0" }

# from crates.io:
xdrs = { package = "thruput-xdrs", version = "0.18.0", features = ["alloc"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
hex-literal = "1.0.0"
heapless = { version = "0.9.2" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = "3"

[profile.release]
trim-paths = "all" # unstable

# The chain caps a contract's code at 64 KiB. The Speedex example's clearing engine (128-bit and
# 256-bit fixed-point arithmetic, reached from several entry points) is over that at opt-level 3
# and well under it optimized for size.
[profile.release.package.speedex]
opt-level = "s"

# The FHE example's tests evaluate hundreds of bootstrapped gates natively; unoptimized, each
# takes seconds.
[profile.dev.package.fhe-core]
opt-level = 3
[profile.dev.package.fhe-client]
opt-level = 3
