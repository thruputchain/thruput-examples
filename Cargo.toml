cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"

members = [
    "contracts/*",
    "engines/*",
    "interfaces/*",
    "sim-fixtures/*",
    "helpers/*",
    ]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Thruput Team"]
publish = false
repository = "https://github.com/thruputchain/thruput-examples.git"
homepage = "https://github.com/thruputchain/thruput-examples"
keywords = ["thruput"]
categories = ["blockchain"]

[workspace.dependencies]
# from thruput-sdk-rs:
thruput-sdk = { registry = "thruput", version = "=0.52.3" }
thruput-contract-util = { registry = "thruput", version = "=0.52.3" }
thruput-u256 = { registry = "thruput", version = "=0.52.3", default-features = false }
thruput-domain-separator = { registry = "thruput", version = "=0.52.3", default-features = false }
thruput-event = { registry = "thruput", version = "=0.52.3" }
thruput-erc20-if = { registry = "thruput", version = "=0.1.62" }
thruput-erc20-metadata-if = { registry = "thruput", version = "=0.1.62" }
thruput-erc20-controls-if = { registry = "thruput", version = "=0.1.62" }
thruput-erc20-permit-if = { registry = "thruput", version = "=0.1.62" }
thruput-signed-op-if = { registry = "thruput", version = "=0.1.62" }
thruput-signed-op = { registry = "thruput", version = "=0.1.62" }

# from thruput-tools:
thruput-json-rpc-client = { registry = "thruput", version = "=0.33.0" }
thruput-json-rpc-types = { registry = "thruput", version = "=0.33.0" }
thruput-cli = { registry = "thruput", version = "=0.33.0" }
thruput-signing = { registry = "thruput", version = "=0.33.0" }
thruput-testkit = { registry = "thruput", version = "=0.33.0" }

# from thruput-protocol-rs:
thruput-xdr = { registry = "thruput", version = "=0.56.4", features = ["serde", "xdrs"] }
thruput-trace = { registry = "thruput", version = "=0.56.4" }
xdrs = { registry = "thruput", version = "=0.12.0", features = ["alloc"] }

# from crates.io:
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
hex-literal = "1.0.0"
heapless = { version = "0.9.2" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = "3"

[profile.release]
trim-paths = "all" # unstable

# The chain caps a contract's code at 64 KiB. The Speedex example's clearing engine (128-bit and
# 256-bit fixed-point arithmetic, reached from several entry points) is over that at opt-level 3
# and well under it optimized for size.
[profile.release.package.speedex]
opt-level = "s"
