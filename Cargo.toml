cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"

members = [
    "contracts/*",
    "engines/*",
    "interfaces/*",
    "sim-fixtures/*",
    "helpers/*",
    ]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Groundhog Team"]
publish = false
repository = "https://github.com/groundhogchain/groundhog-examples.git"
homepage = "https://github.com/groundhogchain/groundhog-examples"
keywords = ["groundhog"]
categories = ["blockchain"]

[workspace.dependencies]
# from sdk_rs repo:
sdk = { registry = "groundhog", version = "=0.42.2" }
groundhog-contract-util = { registry = "groundhog", version = "=0.42.2" }
groundhog-u256 = { registry = "groundhog", version = "=0.42.2", default-features = false }
groundhog-domain-separator = { registry = "groundhog", version = "=0.42.2", default-features = false }
groundhog-event = { registry = "groundhog", version = "=0.42.2" }
groundhog-erc20-if = { registry = "groundhog", version = "=0.1.44" }
groundhog-erc20-metadata-if = { registry = "groundhog", version = "=0.1.44" }
groundhog-erc20-controls-if = { registry = "groundhog", version = "=0.1.44" }
groundhog-erc20-permit-if = { registry = "groundhog", version = "=0.1.44" }
groundhog-signed-op-if = { registry = "groundhog", version = "=0.1.44" }
groundhog-signed-op = { registry = "groundhog", version = "=0.1.44" }

# from groundhog-rpc repo:
groundhog-json-rpc-client = { registry = "groundhog", version = "=0.22.1" }
groundhog-json-rpc-types = { registry = "groundhog", version = "=0.22.1" }
groundhog-signing = { registry = "groundhog", version = "=0.22.1" }
groundhog-testkit = { registry = "groundhog", version = "=0.22.1" }

# from other groundhog crates:
groundhog-xdr = { registry = "groundhog", version = "=0.43.0", features = ["serde", "xdrs"] }
groundhog-trace = { registry = "groundhog", version = "=0.43.0" }
xdrs = { registry = "groundhog", version = "=0.10.2", features = ["alloc"] }

# from crates.io:
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
hex-literal = "1.0.0"
heapless = { version = "0.9.2" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = "3"

[profile.release]
trim-paths = "all" # unstable

# The chain caps a contract's code at 64 KiB. The Speedex example's clearing engine (128-bit and
# 256-bit fixed-point arithmetic, reached from several entry points) is over that at opt-level 3
# and well under it optimized for size.
[profile.release.package.speedex]
opt-level = "s"
