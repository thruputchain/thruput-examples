[package]
name = "swap_itest"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Multi-contract RPC integration test for the swap example contracts"

# A native test driver (NOT a contract): it deploys and exercises the swap
# contracts over JSON-RPC. Run via `groundhog test --integration --bin swap_itest`.

[[bin]]
name = "swap_itest"
path = "src/main.rs"

[dependencies]
groundhog-json-rpc-client = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
groundhog-signing = { workspace = true }
groundhog-contract-util = { workspace = true }
groundhog-xdr = { workspace = true }
xdrs = { workspace = true }
xdr-common = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
