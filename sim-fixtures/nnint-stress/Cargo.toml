[package]
name = "nnint-stress"
description = "NNInt simulator stress fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "nnint_stress"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
nnint-stress = { path = ".", features = ["dev"] }
