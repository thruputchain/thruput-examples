[package]
name = "nnint-stress"
description = "NNInt simulator stress fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
entrypoints = []
rv32-entrypoints = ["entrypoints"]
dev = ["sdk/dev", "sdk/debugging"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "nnint_stress"
path = "src/main.rs"
required-features = ["rv32-entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }

[dev-dependencies]
nnint-stress = { path = ".", features = ["dev"] }
