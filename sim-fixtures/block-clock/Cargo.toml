[package]
name = "block-clock"
description = "Contract that reports its block timepoint, used to test local block time control"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "block_clock"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
block-clock = { path = ".", features = ["dev"] }
