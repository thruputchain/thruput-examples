[package]
name = "caller-counter"
description = "Per-caller counter contract used as a read-after-write simulation fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
entrypoints = []
rv32-entrypoints = ["entrypoints"]
dev = ["sdk/dev", "sdk/debugging"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[[bin]]
name = "caller_counter"
path = "src/main.rs"
required-features = ["rv32-entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true, features = ["storage"] }

[dev-dependencies]
caller-counter = { path = ".", features = ["dev"] }
