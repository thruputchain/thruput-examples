[package]
name = "caller-counter"
description = "Per-caller counter contract used as a read-after-write simulation fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = ["thruput-sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "caller_counter"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
thruput-sdk = { workspace = true }

[dev-dependencies]
caller-counter = { path = ".", features = ["dev"] }
