[package]
name = "calldata"
description = "Calldata-heavy simulator fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false

[[bin]]
name = "calldata"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }

[dev-dependencies]
calldata = { path = ".", features = ["dev"] }
