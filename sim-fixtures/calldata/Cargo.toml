[package]
name = "calldata"
description = "Calldata-heavy simulator fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
entrypoints = []
dev = ["sdk/dev", "sdk/debugging"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }

[dev-dependencies]
calldata = { path = ".", features = ["dev"] }
