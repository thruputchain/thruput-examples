# Allowlist for `cargo cooldown-check`.
# Keep in sync with the [[allow.package]] and [[allow.exact]] entries in
# ../cooldown.toml. Each [[allow.package]] entry here names one crate.

# Security fix for ctutils 0.4.3 and earlier (fixed in 0.4.4).
[[allow.exact]]
crate = "ctutils"
version = "0.4.5"

# Security fix for RUSTSEC-2026-0386 (AsyncFd constructors deprecated).
[[allow.exact]]
crate = "tokio"
version = "1.53.3"

# Security fix for RUSTSEC-2026-0574 to RUSTSEC-2026-0582 (heapless unsound
# APIs, fixed in 0.9.4). Remove once 0.9.4 is past the cooldown (2026-11-26).
[[allow.exact]]
crate = "heapless"
version = "0.9.4"

# Required by the thruput-tools 0.47.0 crates (jsonrpsee ^0.26.2), which pin
# hog-devnode 0.1.36. Remove once 0.26.2 is past the cooldown (2026-11-26).
[[allow.exact]]
crate = "jsonrpsee"
version = "0.26.2"

[[allow.exact]]
crate = "jsonrpsee-core"
version = "0.26.2"

[[allow.exact]]
crate = "jsonrpsee-http-client"
version = "0.26.2"

[[allow.exact]]
crate = "jsonrpsee-proc-macros"
version = "0.26.2"

[[allow.exact]]
crate = "jsonrpsee-server"
version = "0.26.2"

[[allow.exact]]
crate = "jsonrpsee-types"
version = "0.26.2"

# Security fix for RUSTSEC-2026-0592 (stack overflow in `Url::origin()` on
# nested `blob:` URLs, fixed in url 2.5.9, which requires form_urlencoded
# 1.2.3). Remove once both are past the cooldown (2026-11-29).
[[allow.exact]]
crate = "url"
version = "2.5.9"

[[allow.exact]]
crate = "form_urlencoded"
version = "1.2.3"

# Grandfathered versions ... (can remove after 2026 Nov 9)

[[allow.exact]]
crate = "indoc"
version = "2.0.8"

[[allow.exact]]
crate = "rustls"
version = "0.23.46"

[[allow.exact]]
crate = "rustls-webpki"
version = "0.103.16"

[[allow.exact]]
crate = "toml"
version = "1.1.8+spec-1.1.0"

[[allow.exact]]
crate = "toml_parser"
version = "1.1.5+spec-1.1.0"

[[allow.exact]]
crate = "webpki-root-certs"
version = "1.0.10"

[[allow.exact]]
crate = "zstd-sys"
version = "2.1.1+zstd.1.5.7"

