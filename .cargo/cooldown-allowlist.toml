# Allowlist for `cargo cooldown-check`.
# Keep in sync with the [[allow.package]] and [[allow.exact]] entries in
# ../cooldown.toml. Each [[allow.package]] entry here names one crate.

# Security fix for RUSTSEC-2026-0574 to RUSTSEC-2026-0582 (heapless unsound
# APIs, fixed in 0.9.4). Remove once 0.9.4 is past the cooldown (2026-11-26).
[[allow.exact]]
crate = "heapless"
version = "0.9.4"

