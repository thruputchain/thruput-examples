[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "link-args=-zstack-size=30000",
    "-Z", "unstable-options",
    "--deny", "warnings",
    ]

[target.riscv32im-unknown-none-elf]
rustflags = [
    "-C", "target-feature=+unaligned-scalar-mem",
    "-C", "link-arg=-Tgroundhog-rv32.ld",
    "-C", "link-arg=-static",
    "-C", "link-arg=--no-dynamic-linker",
    "-C", "link-arg=--gc-sections",
    "-C", "link-arg=--no-check-sections",
    "-C", "panic=abort",
    "-C", "relocation-model=static",
    "-Z", "trap-unreachable=false",
    "--deny", "warnings",
    ]

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1

[registries]
groundhog = { index = "sparse+https://groundhog.dev/crates/api/v1/crates/" }

[source]
groundhog = { registry = "sparse+https://groundhog.dev/crates/api/v1/crates/" }
