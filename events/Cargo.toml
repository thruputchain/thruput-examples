[package]
name = "events"
description = "Example contract demonstrating #[derive(Event)] with various topic and payload patterns"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
dev = ["sdk/dev"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true, features = ["debugging"] }
xdrs = { workspace = true }

[dev-dependencies]
events = { path = ".", features = ["dev"] }
sha2 = "0.10"
