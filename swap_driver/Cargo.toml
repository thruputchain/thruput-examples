[package]
name = "swap_driver"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[dependencies]
sdk = { workspace = true, features = ["storage"] }
groundhog-erc20-if = { workspace = true }
groundhog-erc20-metadata-if = { workspace = true, optional = true }
uint = { version = "0.10.0", default-features = false }
heapless = { workspace = true }
thiserror = { workspace = true }
swap = { path = "../swap" }

erc20 = { path = "../erc20", features = ["dev"], optional = true }

[features]
entrypoints = []
metadata = ["dep:groundhog-erc20-metadata-if", "erc20?/metadata"]
dev = ["sdk/dev", "dep:erc20", "swap/dev"]
wasm_test = []

[dev-dependencies]
swap_driver = { path = ".", features = ["dev"] }
