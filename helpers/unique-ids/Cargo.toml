[package]
name = "unique-ids"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false # suppress output from our zero unit-tests

[dependencies]
sdk = { workspace = true }

[features]
# Enables std in native tests.
dev = ["sdk/dev"]

# Turns the `dev` feature on for the tests in `tests/`.
[dev-dependencies]
unique-ids = { path = ".", features = ["dev"] }

[lints]
clippy.result_large_err = "allow"
