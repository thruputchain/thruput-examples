[package]
name = "token-factory-test-if"
description = "Test-only interfaces for token factory feasibility fixtures"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }
standard-token-factory-if = { path = "../../contracts/standard-token-factory-if" }

[features]
dev = ["sdk/dev", "standard-token-factory-if/dev"]

[lints]
clippy.result_large_err = "allow"
# The wallet forwards the factory's fixed create_token ABI plus its address.
clippy.too_many_arguments = "allow"
