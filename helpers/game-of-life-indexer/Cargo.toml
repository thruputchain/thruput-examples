[package]
name = "game-of-life-indexer"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
fs2 = "0.4"
game-of-life-core = { path = "../game-of-life-core" }
groundhog-contract-util = { workspace = true }
groundhog-json-rpc-client = { workspace = true }
groundhog-json-rpc-types = { workspace = true }
groundhog-xdr = { workspace = true }
hex = { workspace = true }
jsonrpsee-core = "0.25.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "signal", "sync"] }
xdrs = { workspace = true }

[dev-dependencies]
tempfile = "3"
