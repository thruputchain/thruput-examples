[package]
name = "token-factory-test-wallet"
description = "Test-only wallet contract for token factory feasibility tests"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
entrypoints = []
rv32-entrypoints = ["entrypoints"]
dev = [
    "sdk/dev",
    "standard-token-factory-if/dev",
    "token-factory-test-if/dev",
]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[[bin]]
name = "token_factory_test_wallet"
path = "src/main.rs"
required-features = ["rv32-entrypoints"]
test = false
bench = false

[dependencies]
sdk = { workspace = true }
standard-token-factory-if = { path = "../../contracts/standard-token-factory-if" }
token-factory-test-if = { path = "../token-factory-test-if" }

[dev-dependencies]
token-factory-test-wallet = { path = ".", features = ["dev"] }
token-factory-failing-child = { path = "../token-factory-failing-child", features = ["dev"] }

[lints]
clippy.result_large_err = "allow"
