[package]
name = "batch-driver"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false # suppress output from our zero unit-tests

[dependencies]
thruput-sdk = { workspace = true }
unique-ids = { path = "../unique-ids" }

[features]
# Enables failure logging (and std) in native tests.
dev = ["thruput-sdk/dev", "unique-ids/dev"]
calibration = []

[dev-dependencies]
batch-driver = { path = ".", features = ["dev"] }

[lints]
clippy.result_large_err = "allow"
