[package]
name = "multi-impl"
description = "Example contract implementing two traits from a separate crate"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
dev = ["sdk/dev", "multi-impl-traits/dev"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
sdk = { workspace = true }

multi-impl-traits = { path = "../multi-impl-traits" }

[dev-dependencies]
multi-impl = { path = ".", features = ["dev"] }
