[package]
name = "stellar-account-factory-if"
description = "Shared interfaces and address derivation for the Stellar-classic account factory"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false

[dependencies]
thruput-sdk = { workspace = true }
thruput-erc20-if = { workspace = true }
thiserror = { workspace = true, optional = true }
# `dev`-only off-chain address derivation (`account_address_offchain`).
thruput-signing = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
stellar-account-factory-if = { path = ".", features = ["dev"] }

[features]
dev = ["thruput-sdk/dev", "thruput-erc20-if/dev", "dep:thiserror", "dep:thruput-signing", "dep:sha2"]
