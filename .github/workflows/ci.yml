name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
      CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --target wasm32-unknown-unknown

      - name: Check format
        run: cargo fmt --check

      - name: Cache groundhog-cli
        id: cache-groundhog
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/groundhog
          key: groundhog-cli-${{ runner.os }}-v1

      - name: Install groundhog-cli
        if: steps.cache-groundhog.outputs.cache-hit != 'true'
        run: cargo install --registry groundhog groundhog-cli

      - name: Build contracts
        run: |
          for pkg in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select([.targets[].kind[]] | index("cdylib")) | .name'); do
            echo "::group::groundhog build -p $pkg"
            groundhog build -p "$pkg"
            echo "::endgroup::"
          done

      - name: Run tests
        run: cargo test --all
