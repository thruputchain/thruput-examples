name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@groundhogchain'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || github.token }}
      - run: npm run typecheck
      - run: npm test
      # Public settings arrive at runtime; production bundles need no deployment env.
      - run: npm run build --workspaces
      - run: npx --no-install playwright-core install --with-deps chromium
      - name: Browser acceptance
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          npm run test:browser

  build-and-test:
    strategy:
      matrix:
        runner: [namespace-profile-hogd-linux-2604, namespace-profile-hogd-arm64-macos]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test Groundhog CLI version checks
        run: bash scripts/check-groundhog-version.test.sh

      - name: Set up Rust toolchain
        run: rustup show

      - name: Build native tests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --all --locked --no-run

      - name: Run native tests
        run: cargo test --all --locked

      - name: Cache groundhog-cli
        id: cache-groundhog
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/groundhog
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: groundhog-cli-${{ runner.os }}-${{ runner.arch }}-0.19.0

      - name: Install groundhog-cli
        run: cargo install --registry groundhog --version 0.19.0 --locked groundhog-cli

      - name: Build guest contracts
        run: ./scripts/build-guest.sh

      - name: Run `test_r32` tests
        run: |
          for p in erc20 counter speedex; do
              groundhog test -p "$p"
          done

      - name: Run `guest_test` tests
        run: |
          for p in swap-driver swap-router swap-factory; do
              cargo test -p "$p" -F guest_test --locked
          done

  quality-checks:
    runs-on: namespace-profile-hogd-linux-2604
    env:
      CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Rust toolchain
        run: rustup show

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --no-deps --locked -- -D warnings

      - name: Run rustfmt
        run: cargo fmt --check
