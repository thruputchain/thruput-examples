name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swap-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/swap/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm --prefix apps/swap ci

      - name: Check swap frontend
        run: |
          npm --prefix apps/swap run typecheck
          npm --prefix apps/swap test
          npm --prefix apps/swap run build
          bash -n apps/swap/scripts/setup-local.sh
          bash -n apps/swap/scripts/crank-local.sh
          bash -n apps/swap/scripts/generate-contract-bindings.sh

  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
      CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Build native tests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --all --locked --no-run

      - name: Run native tests
        run: cargo test --all

      - name: Cache groundhog-cli
        id: cache-groundhog
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/groundhog
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: groundhog-cli-${{ runner.os }}-v2

      - name: Install groundhog-cli
        run: cargo install --registry groundhog --version 0.9.6 --locked groundhog-cli

      - name: Build guest contracts
        run: ./scripts/build-guest.sh

      - name: Run `test_r32` tests
        run: |
          for p in erc20 counter; do
              groundhog test -p "$p"
          done

      - name: Run `guest_test` tests
        run: |
          for p in swap-driver swap-router; do
              cargo test -p "$p" -F guest_test
          done

  quality-checks:
    runs-on: ubuntu-latest
    env:
      HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
      CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Run rustfmt
        run: cargo fmt --check
