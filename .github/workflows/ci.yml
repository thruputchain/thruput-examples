name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
      CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Build native tests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --all --locked --no-run

      - name: Run native tests
        run: cargo test --all

      - name: Cache groundhog-cli
        id: cache-groundhog
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/groundhog
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: groundhog-cli-${{ runner.os }}-v1

      - name: Install groundhog-cli
        run: cargo install --registry groundhog --version 0.9.2 --locked groundhog-cli

      - name: Build guest contracts
        run: ./scripts/build-guest.sh

      - name: Run `test_r32` tests
        run: |
          for p in erc20 counter; do
              groundhog test -p "$p"
          done

      - name: Run `guest_test` tests
          for p in swap-driver swap-router; do
              cargo test -p "$p" -F guest_test
          done

  quality-checks:
    runs-on: ubuntu-latest
    env:
      HOGD_FFI_PASSWORD: ${{ secrets.HOGD_FFI_PASSWORD }}
      CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Run rustfmt
        run: cargo fmt --check
