name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-policy:
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/rust-dependency-policy.yml@v1
    with:
      registry-name: thruput
      # The workspace manifest opts into the nightly-only `trim-paths` cargo
      # feature, so the stable cargo the reusable workflow defaults to cannot
      # parse it. Must match rust-toolchain.toml; quality-checks verifies that.
      toolchain: nightly-2026-07-01
    secrets:
      registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

  workflow-lint:
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/workflow-lint.yml@v1

  # Not gated on dependency-policy: that job checks the cargo graph, and this
  # one builds only the npm workspace.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@thruputchain'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || github.token }}
      - run: npm run typecheck
      - run: npm test
      # Public settings arrive at runtime; production bundles need no deployment env.
      - run: npm run build --workspaces
      - run: npx --no-install playwright-core install --with-deps chromium
      - name: Browser acceptance
        run: |
          CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          export CHROMIUM_PATH
          npm run test:browser

  frontend-live:
    needs: [dependency-policy, frontend]
    permissions:
      contents: read
      packages: read
    runs-on: namespace-profile-hogd-linux-2604
    timeout-minutes: 30
    env:
      CARGO_REGISTRIES_THRUPUT_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
      CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@thruputchain'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || github.token }}
      - name: Install the published Thruput CLI and runtime
        run: |
          cargo install --registry thruput --version 0.29.0 --locked thruput-cli
          thruput toolchain install
          echo "THRUPUT_CLI=$(command -v thruput)" >> "$GITHUB_ENV"
          echo "THRUPUT_DEVNODE_BINARY=$(thruput toolchain which)" >> "$GITHUB_ENV"
      - name: Generate fresh contract bindings
        run: |
          npm run generate:contracts --workspaces
          npm run examples:generate
          git diff --exit-code -- examples/typescript/generated
      - run: npm run build --workspaces
      - name: Install the live-test browser
        run: |
          npx --no-install playwright-core install --with-deps chromium
          CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
      - name: Qualify the client examples, counter, seeding, and batched transactions
        run: |
          npm run test:examples
          npm run test:counter
          npm run test:seed
          npm run test:batching

  build-and-test:
    needs: dependency-policy # inspect dependencies before anything builds them
    permissions:
      contents: read
    strategy:
      matrix:
        runner: [namespace-profile-hogd-linux-2604, namespace-profile-hogd-arm64-macos]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_REGISTRIES_THRUPUT_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
      CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test Thruput CLI version checks
        run: bash scripts/check-thruput-version.test.sh

      - name: Set up Rust toolchain
        run: rustup show

      - name: Build native tests
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --all --locked --no-run

      - name: Run native tests
        run: cargo test --all --locked

      - name: Cache thruput-cli
        id: cache-thruput
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/thruput
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: thruput-cli-${{ runner.os }}-${{ runner.arch }}-0.29.0

      - name: Install thruput-cli
        run: cargo install --registry thruput --version 0.29.0 --locked thruput-cli

      - name: Configure local build profile
        run: |
          printf 'default_profile = "local"\n[profile.local]\nnetwork = "local"\n' > thruput.toml

      - name: Run RPC integration tests
        run: |
          thruput toolchain install
          THRUPUT_DEVNODE_BINARY="$(thruput toolchain which)" ./scripts/integration-tests.sh

      - name: Build guest contracts
        run: ./scripts/build-guest.sh

      - name: Run `test_r32` tests
        run: |
          for p in erc20 counter speedex; do
              thruput test -p "$p"
          done

      - name: Run `guest_test` tests
        run: |
          for p in swap-driver swap-router swap-factory; do
              cargo test -p "$p" -F guest_test --locked
          done

  quality-checks:
    needs: dependency-policy
    permissions:
      contents: read
    runs-on: namespace-profile-hogd-linux-2604
    env:
      CARGO_REGISTRIES_THRUPUT_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
      CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        run: rustup show

      - name: Dependency-policy toolchain matches rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          for f in .github/workflows/ci.yml .github/workflows/audit.yml; do
            grep -Fq "toolchain: $channel" "$f" || {
              echo "::error file=$f::dependency-policy toolchain pin does not match rust-toolchain.toml ($channel)"
              exit 1
            }
          done

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --no-deps --locked -- -D warnings

      - name: Run rustfmt
        run: cargo fmt --check
