name: Publish wallet download

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/wallet-extension/**
      - .github/workflows/publish-wallet.yml

permissions:
  contents: read
  packages: read

concurrency:
  group: publish-wallet
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'groundhogchain/groundhog-examples' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write
    defaults:
      run:
        working-directory: apps/wallet-extension
    env:
      BUCKET: groundhog-public-release-artifacts-017820684264
      BASE_URL: https://groundhog-public-release-artifacts-017820684264.s3.us-west-2.amazonaws.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@groundhogchain'
          cache: npm
          cache-dependency-path: apps/wallet-extension/package-lock.json
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || github.token }}
      - name: Check and package the extension
        run: |
          npm run typecheck
          npm test
          npm run package
          cd artifacts
          sha256sum -c SHA256SUMS
          unzip -t thruput-wallet.zip
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_WALLET_ARTIFACT_ROLE_ARN }}
          aws-region: us-west-2
      - name: Publish build and update the download link
        run: |
          set -euo pipefail
          for file in thruput-wallet.zip SHA256SUMS; do
            type=application/zip
            if [[ "$file" == SHA256SUMS ]]; then type=text/plain; fi
            aws s3 cp "artifacts/$file" "s3://$BUCKET/wallet/$GITHUB_SHA/$file" \
              --content-type "$type" --cache-control 'public,max-age=31536000,immutable' \
              --metadata "source-commit=$GITHUB_SHA" --only-show-errors
          done
          for file in thruput-wallet.zip SHA256SUMS; do
            type=application/zip
            if [[ "$file" == SHA256SUMS ]]; then type=text/plain; fi
            aws s3 cp "artifacts/$file" "s3://$BUCKET/wallet/latest/$file" \
              --content-type "$type" --cache-control 'no-cache' \
              --metadata "source-commit=$GITHUB_SHA" --only-show-errors
          done
      - name: Verify public download
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wallet-download"
          cd "$RUNNER_TEMP/wallet-download"
          curl --fail --silent --show-error --retry 3 -O "$BASE_URL/wallet/latest/thruput-wallet.zip"
          curl --fail --silent --show-error --retry 3 -O "$BASE_URL/wallet/latest/SHA256SUMS"
          sha256sum -c SHA256SUMS
          cmp SHA256SUMS "$GITHUB_WORKSPACE/apps/wallet-extension/artifacts/SHA256SUMS"
          echo "Wallet download: $BASE_URL/wallet/latest/thruput-wallet.zip" >> "$GITHUB_STEP_SUMMARY"
