name: Audit

on:
  schedule:
    - cron: '30 9 * * *' # daily at 09:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/rust-dependency-policy.yml@af074672d3a6f3ddedcacd758224ea5a5cf2a8f3 # v0
    with:
      checks: advisories
      registry-name: groundhog
    secrets:
      registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

  notify:
    needs: scan
    if: failure()
    permissions:
      contents: read
      issues: write # files the advisory issue
    uses: groundhogchain/actions/.github/workflows/rust-advisory-issue.yml@af074672d3a6f3ddedcacd758224ea5a5cf2a8f3 # v0
