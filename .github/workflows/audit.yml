name: Audit

on:
  schedule:
    - cron: '30 9 * * *' # daily at 09:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@v1
    with:
      checks: advisories
      # Same reason as ci.yml: the manifest needs nightly cargo to parse. Must
      # match rust-toolchain.toml; CI's quality-checks verifies that.
      toolchain: nightly-2026-07-01

  notify:
    needs: scan
    if: failure()
    permissions:
      contents: read
      issues: write # files the advisory issue
    uses: thruputchain/actions/.github/workflows/rust-advisory-issue.yml@v1
