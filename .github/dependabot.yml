version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Keep in sync with /cooldown.toml.
    cooldown:
      default-days: 8
      exclude:
        # first-party crates
        - "thruput"
        - "thruput-*"
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Keep in sync with /.npmrc.
    cooldown:
      default-days: 8
      exclude:
        - "@thruputchain/*" # first-party packages
    groups:
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 8
    groups:
      actions:
        patterns: ["*"]
