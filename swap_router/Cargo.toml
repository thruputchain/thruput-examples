[package]
name = "swap_router"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false # suppress output from our zero unit-tests

[dependencies]
sdk = { workspace = true, features = ["storage"] }
groundhog-erc20-if = { workspace = true }
groundhog-erc20-metadata-if = { workspace = true }
thiserror = { workspace = true }
swap = { path = "../swap" }
swap_driver = { path = "../swap_driver" }

# Optional
erc20 = { path = "../erc20", features = ["dev"], optional = true }

[features]
entrypoints = []
dev = ["sdk/dev", "dep:erc20", "swap/dev", "swap_driver/dev"]
wasm_test = []

[dev-dependencies]
swap_router = { path = ".", features = ["dev"] }
